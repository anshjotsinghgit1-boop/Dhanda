name: Python CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q app
      - run: python -m pip install -r requirements.txt
      - run: python -c "import app.club_competitions, app.competition_images, app.npcs, app.timed_events"
      - run: python -m unittest discover -s tests -v
